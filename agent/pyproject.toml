[project]
name = "generative-ai-chat-agent"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "bedrock-agentcore==1.21.0",
  "langchain-aws==1.7.1",
  "langgraph==1.2.11",
  "langgraph-checkpoint-aws==1.2.2",
  "mcp-proxy-for-aws==1.6.4",
  "numpy==2.2.6",
  "pydantic==2.12.5",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "graph", "prompts", "schemas", "rag", "web_search"]

[project.optional-dependencies]
dev = [
  "mypy==1.19.1",
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
  "ruff==0.15.5",
]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[tool.pytest.ini_options]
testpaths = ["tests"]
